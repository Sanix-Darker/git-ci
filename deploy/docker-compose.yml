services:
  git-ci-site:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${GIT_CI_SITE_IMAGE:-git-ci-site:local}
    restart: unless-stopped
    expose:
      - "8087"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - git-ci-site
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      GCI_SITE_ADDRESS: ${GCI_SITE_ADDRESS:-gci.example.com}
      GCI_UPSTREAM: git-ci-site:8087
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
